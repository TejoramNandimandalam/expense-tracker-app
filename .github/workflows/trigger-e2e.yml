# After a push to the qa branch: wait until qa is running that commit, then start all e2e tests.
name: Trigger e2e tests

on:
  push:
    branches: [qa]

jobs:
  trigger-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Work out the release number from package.json (4.0.0 -> 4)
        id: release
        run: echo "number=$(node -p "require('./package.json').version.split('.')[0]")" >> "$GITHUB_OUTPUT"

      # Vercel needs about a minute to build. Ask /api/health which commit qa is running
      # and wait until it is the commit that was just pushed.
      - name: Wait until qa is running this commit
        env:
          # lets this check through Vercel's login wall (stored as a secret)
          VERCEL_BYPASS_SECRET: ${{ secrets.VERCEL_BYPASS_SECRET }}
        run: |
          URL="https://expense-tracker-app-git-qa-expense-tracker-6a12.vercel.app/api/health"
          for i in $(seq 1 60); do
            COMMIT=$(curl -s -H "x-vercel-protection-bypass: $VERCEL_BYPASS_SECRET" "$URL" | jq -r '.commit // empty' 2>/dev/null || true)
            echo "attempt $i: qa is running '${COMMIT}', waiting for '${GITHUB_SHA}'"
            if [ "$COMMIT" = "$GITHUB_SHA" ]; then exit 0; fi
            sleep 10
          done
          echo "qa did not start running this commit within 10 minutes"
          exit 1

      - name: Ask the e2e repo to run all tests on qa
        env:
          # A GitHub token that is allowed to start workflows in the e2e repo (stored as a secret)
          E2E_DISPATCH_TOKEN: ${{ secrets.E2E_DISPATCH_TOKEN }}
        run: |
          curl --fail-with-body -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $E2E_DISPATCH_TOKEN" \
            https://api.github.com/repos/TejoramNandimandalam/expense-tracker-e2e/dispatches \
            -d '{"event_type":"deployment-finished","client_payload":{"env":"qa","suite":"all","release":"${{ steps.release.outputs.number }}"}}'
